<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ quote.quote_number }}</title>
<style>body{font:17px Arial;background:#f3f6fa;color:#172033;margin:0}.card{max-width:760px;margin:50px auto;background:white;padding:30px;border-radius:14px;box-shadow:0 3px 14px #20304a12}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.button{display:inline-block;text-decoration:none;border:0;border-radius:9px;background:#155eef;color:#fff;font:700 16px Arial;padding:12px 17px;cursor:pointer}.secondary{background:#e8efff;color:#155eef}</style></head>
<body><main class="card"><h1>Запрос сохранён</h1><p><strong>{{ quote.quote_number }}</strong></p><p>Клиент: {{ quote.customer }} · {{ quote.customer.email }}</p><p>Срок: {{ quote.rental_days }} дн.</p><p>Это черновик оферты. Заказ поставщику ещё не создан.</p>
<div class="actions"><a class="button" href="{% url 'quotes:calculate_quote' quote.quote_number %}">Перейти к расчёту</a><a class="button secondary" href="{% url 'quotes:edit_quote' quote.quote_number %}">Изменить эту оферту</a><form method="post" action="{% url 'quotes:duplicate_quote' quote.quote_number %}">{% csrf_token %}<button class="button secondary" type="submit">Новая оферта для этого клиента</button></form></div>
</main><script>localStorage.removeItem('rentacar-first-inquiry-draft-v2');</script></body></html>
