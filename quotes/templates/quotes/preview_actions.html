{% load i18n %}
<section class="preview-actions" dir="ltr" aria-label="Действия с офертой">
  <div class="preview-actions-main">
    <form method="post" action="{% url 'quotes:send_quote' quote.quote_number %}">{% csrf_token %}<button class="action-primary" type="submit">{% translate "Выслать" %} из системы</button></form>
    <button class="action-secondary" type="button" data-copy-offer="{% url 'quotes:copy_quote' quote.quote_number %}">{% translate "Скопировать" %} оферту</button>
    <a class="action-secondary" href="{% url 'quotes:email_editor' quote.quote_number %}">Редактировать письмо</a>
  </div>
  <p class="action-recipient">{% translate "Кому" %}: <span dir="ltr">{{ quote.customer.email|default:"Email клиента не указан" }}</span></p>
  <div class="preview-actions-more">
    <a href="{% url 'quotes:edit_quote' quote.quote_number %}">{% translate "Данные аренды" %}</a>
    <a href="{% url 'quotes:calculate_quote' quote.quote_number %}">{% translate "К расчёту" %}</a>
    <form method="post" action="{% url 'quotes:duplicate_quote' quote.quote_number %}">{% csrf_token %}<button type="submit">Новая оферта для клиента</button></form>
    <a href="{% url 'quotes:home' %}">{% translate "На главную" %}</a>
  </div>
</section>
