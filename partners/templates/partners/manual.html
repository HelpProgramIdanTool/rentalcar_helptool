{% extends 'partners/base.html' %}{% block content %}<section class="panel login"><span class="eyebrow">יש עם מי לדבר</span><h1>בדיקה אישית עם עידן.</h1><p>נסיעה מיוחדת, נהג צעיר או משהו לא ברור? כתבו כאן. הפרטים שכבר מילאתם יצורפו לפנייה.</p><form method="post" action="{% url 'partners:manual' %}">{% csrf_token %}{% if draft %}<input type="hidden" name="draft" value="{{ draft.pk }}"><p>{{ draft.trip.pickup_city }} ← {{ draft.trip.return_city }}</p>{% endif %}<label>מה תרצו שנבדוק?<textarea name="message" required maxlength="3000" rows="5"></textarea></label><button class="button primary">העברת הבקשה לעידן ←</button></form></section>{% endblock %}
