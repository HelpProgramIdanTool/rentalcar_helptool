{% load static %}
<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Клиенты{% endblock %} — Idan Rent a Car</title><link rel="stylesheet" href="{% static 'quotes/workspace.css' %}"><style>.customer-info{display:flex;gap:24px;flex-wrap:wrap;padding:18px;margin-bottom:20px}.customer-info p{margin:0;line-height:1.7}.customer-warning{padding:14px;background:#fff4df;color:#854a13;border-radius:8px;margin-bottom:20px;white-space:pre-line}.copy-offer{display:inline}.copy-offer button{font:inherit;color:#245dba;background:none;border:0;cursor:pointer;padding:6px 0;font-weight:600}.offer-table td:last-child a{margin-right:15px}</style></head><body class="workspace-body"><div class="workspace">{% include 'quotes/sidebar.html' %}<main class="workspace-main">{% block content %}{% endblock %}</main></div><script>document.querySelectorAll('tr[data-href]').forEach(row=>row.addEventListener('click',event=>{if(!event.target.closest('a,button,input,form')&&!window.getSelection().toString())window.location.href=row.dataset.href;}));</script></body></html>
